[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recall"
version = "0.0.1"
description = "Branchable, replayable agent memory kernel backed by CockroachDB."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Recall" }]
dependencies = [
    "psycopg[binary,pool]>=3.1,<4",
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0",
    # Official Python MCP SDK — powers mcp_server/ (Phase 5).
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["kernel", "mcp_server", "agent"]

[project.scripts]
# Entry point the MCP client configs in the README point at.
recall-mcp = "mcp_server.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
